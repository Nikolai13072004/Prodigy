<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <alias binding="same">
    <family>Grandview</family>
    <prefer>
      <family>Carlito</family>
      <family>Liberation Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Calibri</family>
    <prefer>
      <family>Carlito</family>
      <family>Liberation Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Aptos</family>
    <prefer>
      <family>Carlito</family>
      <family>Liberation Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Aptos Display</family>
    <prefer>
      <family>Carlito</family>
      <family>Liberation Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Meiryo</family>
    <prefer>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Yu Gothic</family>
    <prefer>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>CosineVTI</family>
    <prefer>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>
</fontconfig>
