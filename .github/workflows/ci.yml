name: CI

# Проверки, которые до этого запускались руками и поэтому регулярно
# пропускались. Порядок шагов — от самого дешёвого к самому долгому, чтобы
# очевидная поломка была видна за секунды, а не через сборку.
#
# E2E сюда намеренно не входит: Playwright требует установленного Chromium,
# прогон живёт локально (`npm run test:e2e`).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # Реальная база здесь не нужна: `prisma generate`, `migrate diff` и
      # `next build` только резолвят переменную, подключения не открывают.
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-secret-never-used-at-runtime

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Мажорная версия та же, что в Dockerfile (node:20.20-bookworm-slim).
          # Расхождение с прод-рантаймом означало бы, что CI проверяет не то,
          # что выкатывается.
          node-version: '20'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: deploy-guard — схема накатывается через db push
        # Возврат к `migrate deploy` роняет прод в рестарт-луп (P3005) и следом
        # все воркеры. Обоснование: docs/architecture/010-database-migration-strategy.md
        run: node scripts/deploy-guard.mjs

      - name: Расхождение миграций и schema.prisma
        # На проде схема применяется через `db push`, а миграции продолжают
        # вестись — без этой проверки они молча расходятся со схемой.
        # Команда намеренно совпадает с той, что описана в CLAUDE.md, — чтобы
        # локальная проверка и CI не разъехались.
        run: >
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Линтер
        run: npm run lint

      - name: Unit-тесты
        run: npm run test:unit

      - name: Схема для сборки
        # На пустой базе сборка проходит, но засыпает лог `prisma:error` от
        # platformSettings — настоящая ошибка в этом шуме потерялась бы.
        # Схема накатывается тем же `db push`, что и на проде.
        run: npx prisma db push --skip-generate

      - name: Production-сборка
        run: npm run build
