registry_meta:
  id: app-quality-audit-registry
  version: 1.0.0
  generated_date: '2026-07-09'
  language: ru
  purpose: Machine-readable and agent-readable registry for reviewing an existing pre-production B2B SaaS repository against
    code-first quality, security, architecture and production-readiness criteria.
  source_basis: Corporate manifesto and business application development standard, version 1.0, plus practical code-review
    classification requested by user.
  target_context:
    repository: single repository
    application_type: B2B SaaS
    current_stage: pre-production
    current_service_class: C1
    target_service_class: C2
    review_mode: read_only_audit_no_code_changes
    primary_truth_source: repository code/config/migrations/tests/CI/runtime artifacts
    manifest_role: normative reference and expectation source, not absolute truth when code demonstrates safer justified deviation
severity_model:
  critical:
    meaning: Blocks production/release unless explicitly and formally accepted with compensating controls; normally unacceptable
      for tenant isolation, security, money, data loss, destructive migrations and production secrets.
    default_actions:
    - stop_release
    - create_remediation_task
    - assign_owner
    - require_verification_test_or_control
    examples:
    - cross-tenant access possible
    - runtime DB user bypasses RLS
    - secrets in frontend/repo/image
    - payments without idempotency
    - no usable backup/restore for production data
    - app-start migrations in multi-replica deploy
  high:
    meaning: Material security/data/reliability/business risk; should be fixed before C2 launch or accepted with explicit
      risk owner and expiry.
    default_actions:
    - fix_before_c2_launch
    - document_risk
    - add_tests_or_controls
    examples:
    - no threat model for C2
    - missing CI security gates
    - no pool/backpressure budget
    - provider calls without timeout
    - missing audit trail for privileged actions
  medium:
    meaning: Architecture, operational or maintainability debt that can accumulate into production risk; schedule remediation
      with owner.
    default_actions:
    - prioritize_in_backlog
    - track_owner
    - verify_no_critical_path_impact
    examples:
    - weak module boundaries
    - incomplete runbooks
    - missing CODEOWNERS
    - unowned feature flags
  low:
    meaning: Consistency, readability or maintainability issue with limited immediate risk.
    default_actions:
    - batch_with_refactoring
    - do_not_block_release_unless_compounding
    examples:
    - minor naming inconsistency
    - non-critical duplication
    - format inconsistency not caught by tooling
  info:
    meaning: Observation without immediate risk, uncertainty marker, or context for future review.
    default_actions:
    - record_context
    - no_immediate_fix_required
    examples:
    - feature not applicable
    - accepted design trade-off with evidence
    - future C2 delta item not yet due for current C1 internal use
status_model:
  pass: Requirement is satisfied with concrete code/config/test evidence.
  partial: Some controls exist, but coverage, enforcement or evidence is incomplete.
  fail: Requirement is violated or high-confidence unsafe pattern exists.
  missing_evidence: Could not find evidence. Use when absence is material but violation is not yet proven.
  not_applicable: Feature/scope is not present; justify with repository evidence.
  justified_deviation: Code intentionally deviates from manifesto recommendation with adequate design evidence, tests and
    risk ownership.
  unreviewed: Not assessed yet.
evidence_quality_model:
  code: Source code or SQL directly implements/enforces behavior.
  config: Deployment, CI, proxy, Docker, environment or tool configuration.
  test: Executable tests or CI jobs validate behavior.
  runtime_artifact: Generated OpenAPI, SBOM, image digest, scan report, dashboard, log/metric sample or restore report.
  docs: ADR, runbook, service profile, README, threat model. Docs alone cannot prove runtime behavior.
  absence: Expected artifact or implementation not found after scoped search.
  inferred: Reasonable inference from structure; lower confidence and should be marked.
problem_taxonomy:
  security: Auth, authorization, secrets, web security, supply-chain and access-control weaknesses.
  tenant_isolation: Multi-tenant data separation, RLS, tenant context, membership and ACL failures.
  data_integrity: Database constraints, migrations, transactions, concurrency, idempotency and consistency.
  reliability: Timeouts, retries, jobs, queues, backpressure, graceful shutdown and external dependency handling.
  observability: Logs, metrics, traces, dashboards, alerts and auditability.
  delivery_risk: CI/CD, build/release, deploy, rollback, migration deployment and environment drift.
  architecture_boundary_violation: Frontend/backend/module/worker/provider boundary collapse or hidden service boundary.
  code_quality_defect: Maintainability, readability, testability and structure issue primarily visible in code.
  api_contract_gap: OpenAPI/client/schema/error/versioning/pagination contract gaps.
  testing_gap: Missing or weak tests for invariant/failure/security behavior.
  performance: Unbounded lists, hot queries, pool saturation, load/capacity and degradation.
  operational_risk: Runbooks, backups, restore, incident response, regular ops and ownership gaps.
  ai_safety: AI gateway, tool authorization, prompt injection, RAG ACL, cost and eval risks.
  governance_gap: ADR, exception, ownership, service profile, review and policy issues.
  supply_chain: Dependency, CI identity, artifact provenance, image/SBOM/scanning weaknesses.
  business_risk: Failures that affect revenue path, billing, tenant lifecycle or customer commitments.
  production_blocker: Finding class that should block production/release by default.
  missing_evidence: Expected evidence not found; not automatically a defect but must be surfaced.
  unverified_claim: Documentation or comments claim compliance but code/config/test evidence is absent.
  review_integrity: Issue in the audit process itself that can cause false negatives.
  coverage_gap: Expected scope was not reviewed or was missing without classification.
  maintainability: Issues that increase cost of change and defect probability.
  privacy: Data classification, retention, PII, logs, masking and deletion weaknesses.
  revenue_risk: Money, billing, subscriptions, payments, provisioning and reconciliation risk.
review_scopes:
- scope: repo
  what_to_inventory:
  - workspace/package layout
  - apps/packages/contracts/db/ops/docs/tests
  - languages/runtimes
  - dependencies
  - generated artifacts
- scope: frontend
  what_to_inventory:
  - framework
  - routes/screens
  - API clients
  - auth/session handling
  - public env vars
  - state management
  - security headers if SSR
- scope: backend_api
  what_to_inventory:
  - HTTP framework
  - routes/controllers
  - application modules
  - auth middleware
  - authorization policies
  - config
  - provider adapters
- scope: worker_jobs
  what_to_inventory:
  - worker entrypoints
  - queue library
  - job schemas
  - retry/DLQ
  - cron
  - outbox/inbox
  - tenant context
- scope: db_migrations
  what_to_inventory:
  - migration tool
  - tables
  - constraints
  - roles/grants
  - RLS policies
  - indexes
  - extensions
  - backfills
- scope: infra_deploy
  what_to_inventory:
  - Dockerfiles
  - compose/Kamal/other deploy
  - reverse proxy
  - networks/ports
  - secrets injection
  - backup config
  - observability config
- scope: ci_cd
  what_to_inventory:
  - workflow gates
  - branch/review policy
  - secret scanning
  - SCA/SAST/image scan
  - SBOM
  - OpenAPI diff
  - deploy identity
- scope: docs
  what_to_inventory:
  - service profile
  - ADRs
  - exceptions
  - runbooks
  - threat model
  - restore drill reports
  - release checklist
  - capacity plan
- scope: tests
  what_to_inventory:
  - unit
  - integration with PostgreSQL
  - RLS/authorization negative
  - contract
  - E2E
  - migration
  - security
  - performance/recovery/AI eval
risk_grouping_rules:
- 'Group by root cause and failure mode, not by every file occurrence. Example: multiple frontend localStorage token usages
  become one risk with all evidence paths.'
- 'Keep separate findings when impact, remediation owner or affected trust boundary differs. Example: missing CSRF and missing
  RLS are separate critical risks even if both are security.'
- Code-quality problems are primary when the code itself is unsafe or hard to maintain; mark manifest_violation only when
  the issue is specifically a deviation from the manifesto rule.
- A justified deviation is not a failure if code evidence, tests, operational controls and ADR/exception explain why the chosen
  approach is safer or adequate.
- Do not downgrade risks involving tenant isolation, authorization, secrets, money, irreversible data changes, backups/restore
  or production deploy solely because the team is small.
- For C1->C2 transition, classify current C1 blockers separately from C2-delta blockers. C2-specific missing artifacts are
  high or critical when they affect launch readiness.
- When only docs claim compliance and code evidence is absent, use missing_evidence or unverified_claim, not pass.
- Mark not_applicable only after proving the feature/scope is absent in code, dependencies, routes, migrations and config.
finding_schema:
  finding_id: FIND-<sequential>
  title: Short factual title
  severity:
  - critical
  - high
  - medium
  - low
  - info
  status:
  - open
  - accepted_risk
  - fixed
  - false_positive
  - needs_human_decision
  category: One of categories/problem_taxonomy
  problem_type:
  - manifest_violation
  - code_quality_defect
  - missing_artifact
  - missing_evidence
  - unverified_claim
  - architecture_gap
  - production_readiness_gap
  - justified_deviation
  requirement_refs:
  - ARCH-001
  manifest_sections:
  - '3'
  - '7'
  affected_scopes:
  - frontend
  - backend_api
  affected_modules:
  - orders
  - billing
  evidence:
  - kind: code|config|test|runtime_artifact|docs|absence|inferred
    path: path/to/file
    symbol_or_snippet: function/config/query name
    line_range: L10-L30
    note: Why this proves the finding
  root_cause: Underlying design/code/config cause, not just symptom.
  impact: Technical + business impact.
  likelihood: low|medium|high with rationale
  confidence: low|medium|high
  release_blocker: true
  recommendation: Concrete remediation without editing code during audit.
  verification: 'How to prove fix: test, static check, migration validation, runtime check.'
  adr_or_exception_required: false
  owner_suggestion: team/module/unknown
  dedupe_key: category:root-cause:module
module_audit_schema:
  module_id: orders
  module_type: domain_module|frontend_feature|worker_pipeline|integration|infrastructure|unknown
  purpose: What business capability this module owns.
  paths:
  - src/modules/orders/**
  public_api:
  - src/modules/orders/index.ts
  owned_tables:
  - orders
  - order_items
  api_endpoints:
  - POST /api/orders
  jobs:
  - orders.expire_pending
  external_integrations:
  - stripe
  tenant_scope: tenant_scoped|global_admin|single_tenant|unknown
  data_classes:
  - confidential
  dependencies_in:
  - billing
  dependencies_out:
  - identity
  - notifications
  quality_assessment:
    boundary: pass|partial|fail|missing_evidence
    business_logic_location: backend_application|controller|frontend|mixed|unknown
    transaction_integrity: pass|partial|fail|missing_evidence
    authorization: pass|partial|fail|missing_evidence
    testing: pass|partial|fail|missing_evidence
    operability: pass|partial|fail|missing_evidence
  findings:
  - FIND-001
  module_maturity: prototype|internal_ready|preprod_ready|production_ready|unsafe_for_production
  notes: Evidence-based comments only.
agent_execution_protocol:
  non_negotiables:
  - Do not modify the repository during audit.
  - Do not run destructive commands.
  - Do not use production credentials or access production data.
  - Repository code/config/test evidence is primary; docs are secondary.
  - Every finding must cite concrete paths and line ranges when possible.
  - Explicitly report missing scopes/artifacts.
  - Separate manifest_violation from code_quality_defect and justified_deviation.
  - Classify C1 current readiness and C2 launch delta separately.
  phases:
  - phase: 0
    name: Scope inventory
    output: repo_inventory.yaml with scopes, languages, apps, deploy units, tests, docs, CI and missing artifacts
  - phase: 1
    name: Architecture and dependency map
    output: modules.yaml with module paths, APIs, dependencies, tables, endpoints, jobs and integrations
  - phase: 2
    name: Evidence collection
    output: evidence_map.yaml keyed by requirement_id and module_id
  - phase: 3
    name: Requirement evaluation
    output: requirement_results.yaml with status/pass/fail/partial/missing_evidence/not_applicable
  - phase: 4
    name: Finding and risk grouping
    output: findings.yaml grouped by root cause, severity and affected module
  - phase: 5
    name: Production readiness decision
    output: readiness_report.md with C1 status, C2 delta, blockers and remediation roadmap
  recommended_agent_prompt: 'You are auditing a pre-production B2B SaaS repository against the attached audit registry.

    Do not modify code. Do not rely on README claims as proof. Use code, config, migrations, tests, CI and runtime artifacts
    as primary evidence.

    First produce a scope inventory and module map. Then evaluate requirements. For every finding include concrete file paths,
    line ranges when possible, root cause, severity, affected module/scope, risk, recommendation and verification method.

    Separate code_quality_defect, manifest_violation, missing_evidence, missing_artifact, architecture_gap, production_readiness_gap
    and justified_deviation.

    Classify current C1 readiness separately from C2 launch delta. Missing security, tenant isolation, money, secrets, migrations,
    backup/restore or production deployment controls must not be downgraded because the team is small.'
  codex_notes:
  - 'Use read-only commands: find, rg, git grep, npm/yarn/pnpm scripts inspection, static analysis that does not write files.'
  - Do not run package scripts unless they are clearly non-destructive and do not require secrets; prefer inspecting scripts
    first.
  - When tests are not run, mark executable verification as not_performed and explain why.
  claude_code_notes:
  - Use the registry IDs as TODO checklist entries.
  - 'Use one subtask per scope: repo, frontend, backend, DB/RLS, jobs, infra, CI, docs, tests.'
  - Ask Claude Code to output YAML findings following finding_schema, then a human-readable markdown report.
static_check_templates:
- id: SCT-frontend-forbidden-backend-access
  description: Find frontend direct access to DB/Vault/queues/provider admin SDKs or backend internals.
  suggested_commands:
  - rg -n "from .*(db|database|drizzle|prisma|pg|vault|queue|bull|boss|nats|kafka)|require\(.*(pg|vault|nats|kafka)" apps/web
    packages --glob "*.{ts,tsx,js,jsx}"
  maps_to:
  - ARCH-002
  - FE-001
- id: SCT-localstorage-token
  description: Find browser token storage in localStorage/sessionStorage.
  suggested_commands:
  - rg -n "localStorage|sessionStorage|access[_-]?token|refresh[_-]?token" apps/web src --glob "*.{ts,tsx,js,jsx}"
  maps_to:
  - FE-001
  - AUTH-002
- id: SCT-controller-sql-transactions-provider
  description: Find SQL/transaction/provider SDK calls in controllers/routes.
  suggested_commands:
  - rg -n "sql`|db\.|transaction\(|BEGIN|COMMIT|stripe|openai|anthropic|sendgrid|twilio|fetch\(|axios\." apps/api src --glob
    "*.{ts,js}"
  maps_to:
  - BE-001
  - MOD-003
  - MOD-004
  - INT-001
- id: SCT-tenant-header-trust
  description: Find trusted tenant/user/role headers from browser.
  suggested_commands:
  - rg -n "x-tenant|x-user|x-role|tenant[_-]?id|role" apps/api src --glob "*.{ts,js}"
  maps_to:
  - BE-002
  - TEN-003
  - AUTH-001
- id: SCT-rls-policy-sql
  description: Find RLS enable/force/policies and role grants.
  suggested_commands:
  - rg -n "ENABLE ROW LEVEL SECURITY|FORCE ROW LEVEL SECURITY|CREATE POLICY|BYPASSRLS|SUPERUSER|GRANT|ALTER ROLE|SET LOCAL|set_config"
    db apps/api src --glob "*.{sql,ts,js}"
  maps_to:
  - DB-002
  - TEN-002
  - TEN-003
- id: SCT-startup-migrations
  description: Find migrations launched in app startup/entrypoint.
  suggested_commands:
  - rg -n "migrate|migration|drizzle-kit|prisma migrate|knex migrate|db:push" Dockerfile* docker-compose*.yml compose.yml
    package.json apps ops .github --hidden
  maps_to:
  - MIG-001
  - DB-005
- id: SCT-secrets
  description: Find obvious committed secrets and frontend public secret exposure. Use a real secret scanner when available.
  suggested_commands:
  - rg -n "(SECRET|PRIVATE_KEY|API_KEY|TOKEN|PASSWORD|DATABASE_URL|VAULT_TOKEN|SERVICE_ROLE|STRIPE_SECRET|OPENAI_API_KEY|ANTHROPIC_API_KEY|NEXT_PUBLIC_.*(KEY|TOKEN|SECRET)|VITE_.*(KEY|TOKEN|SECRET))"
    . --hidden --glob "!node_modules" --glob "!.git"
  maps_to:
  - SEC-001
  - FE-001
  - CI-003
- id: SCT-docker-hardening
  description: Find container hardening issues.
  suggested_commands:
  - rg -n "USER |privileged:|docker.sock|cap_add|read_only|mem_limit|cpus|latest|FROM .*:latest" Dockerfile* docker-compose*.yml
    ops . --glob "*.yml" --glob "*.yaml"
  maps_to:
  - CNT-001
- id: SCT-unbounded-lists
  description: Find list endpoints and query limit handling.
  suggested_commands:
  - rg -n "findMany|select\(|limit\(|offset\(|cursor|pageSize|take:|GET.*list|router.get" apps/api src --glob "*.{ts,js}"
  maps_to:
  - API-004
  - FE-004
- id: SCT-money-float
  description: Find risky money float/double usage.
  suggested_commands:
  - rg -n "price|amount|money|currency|decimal|float|double|number" db apps/api src --glob "*.{sql,ts,js}"
  maps_to:
  - BE-004
  - API-005
  - INT-002
- id: SCT-fire-and-forget
  description: Find unawaited promises in request/job code.
  suggested_commands:
  - rg -n "void .*\(|setTimeout\(|setImmediate\(|Promise\.all\(|\.then\(" apps/api apps/worker src --glob "*.{ts,js}"
  maps_to:
  - BE-001
  - JOB-001
- id: SCT-ci-gates
  description: Inventory CI gates.
  suggested_commands:
  - find .github .gitlab ci -maxdepth 4 -type f 2>/dev/null | sort && rg -n "lint|typecheck|test|testcontainers|migration|openapi|secret|trufflehog|gitleaks|semgrep|sast|sbom|scan|grype|trivy|cosign|attest"
    .github .gitlab ci package.json --hidden
  maps_to:
  - CI-002
  - CI-003
  - API-001
report_contract:
  minimum_outputs:
  - repo_inventory.yaml
  - module_scorecards.yaml
  - requirement_results.yaml
  - findings.yaml
  - risk_register.md
  - production_readiness_report.md
  readiness_levels:
    unsafe_for_production: Any unaccepted critical blocker exists or tenant/security/data/secret/backup control is unproven
      for production data.
    prototype: Architecture may work for demos, but production controls are mostly absent.
    internal_ready_C1_limited: C1 internal use possible with explicit accepted risks; C2 launch delta remains.
    preprod_ready_C1: C1 obligations largely met; C2-specific controls may be incomplete.
    c2_launch_candidate: No critical/high unaccepted blockers; C2 controls and evidence mostly present; final human approval
      required.
    production_ready_C2: C2 obligations evidenced by code/config/tests/ops artifacts; no expired exceptions; restore/load/security
      gates passed.
  readiness_decision_rules:
  - Any critical finding with status open => unsafe_for_production or release_blocked.
  - No restore drill evidence for production data => release_blocked for production launch.
  - Shared-schema B2B SaaS without proven RLS + backend authorization + negative tests => release_blocked.
  - Secrets in repo/frontend/image/CI logs => release_blocked until rotated and history/remediation addressed.
  - Payments/billing without idempotency/reconciliation => release_blocked for revenue path.
  - C2 launch without PITR/restore evidence/threat model/load evidence => not C2 production ready even if C1 usable.
  - Medium/low code-quality debt can be deferred only when not on critical path and has owner.
requirements:
- id: AUD-001
  title: Code-first evidence discipline
  manifest_sections:
  - '0'
  - '33'
  - '35'
  - '36'
  - '38'
  category: governance
  scopes:
  - repo
  - docs
  - tests
  - ci_cd
  applies_to_service_classes:
  - C1
  - C2
  applies_to_stage:
  - pre_production
  - production_readiness
  normative_strength_from_manifest: must
  severity_if_failed_default: high
  problem_types:
  - review_integrity
  - unverified_claim
  requirement: The review must base every finding on code, configuration, migrations, tests, CI/CD or runtime artifacts. Manifest
    text and README are not sufficient evidence of implementation.
  evidence_to_collect:
  - complete repository tree
  - source files
  - configuration files
  - migrations
  - tests
  - CI workflow logs/config
  - docs and ADRs as secondary evidence
  how_to_check:
  - Create an evidence map before judging compliance.
  - For every claim, record file path, symbol/function/query/config key and line range when possible.
  - 'Classify evidence quality: code, config, test, runtime-artifact, docs-only, missing.'
  pass_criteria:
  - Concrete code/config/test evidence confirms the requirement, not only README or comments.
  failure_patterns:
  - Finding says compliant because README claims it.
  - No concrete file paths are provided.
  - Review ignores missing artifacts such as CI, migrations or tests.
  risk_if_failed: 'False assurance: production readiness can be overestimated without proving actual implementation.'
  auto_checkability: manual
  adr_or_exception_policy: required_if_deviating_from_required_or_blocking_practice
  severity_downgrade_conditions:
  - Only downgrade when the code path is demonstrably not reachable, not deployed, or the application is truly single-tenant/non-production
    for that path.
  - Do not downgrade security, money, tenant isolation, destructive migration, backup/restore, or production secrets risks
    because the team is small.
  agent_review_instruction: Use the repository as the primary source of truth. Find concrete files, imports, SQL, migrations,
    tests, CI jobs, deployment config, and runtime config examples. Treat README/docs as supporting evidence only. Do not
    modify code. Report absence explicitly when the expected artifact is missing.
  tags: []
- id: AUD-002
  title: Absence reporting for expected scopes
  manifest_sections:
  - '7'
  - '21'
  - '22'
  - '25'
  - '26'
  - '32'
  - '35'
  category: governance
  scopes:
  - frontend
  - backend_api
  - worker_jobs
  - db_migrations
  - infra_deploy
  - ci_cd
  - docs
  - tests
  applies_to_service_classes:
  - C1
  - C2
  applies_to_stage:
  - pre_production
  - production_readiness
  normative_strength_from_manifest: must
  severity_if_failed_default: medium
  problem_types:
  - missing_evidence
  - coverage_gap
  requirement: 'The auditor must explicitly mark whether each expected scope exists, is absent, or is not applicable: frontend,
    backend API, workers/jobs, database migrations, infra/deploy, CI/CD, ADR/runbooks and tests.'
  evidence_to_collect:
  - repository tree
  - package/workspace files
  - Docker/compose/deploy files
  - CI directory
  - .github/.gitlab
  - docs
  - test directories
  how_to_check:
  - Discover top-level apps/packages and operational directories.
  - Create a scope inventory table before detailed findings.
  - Do not assume a missing worker or ADR is acceptable; classify not_applicable only with code evidence.
  pass_criteria:
  - Concrete code/config/test evidence confirms the requirement, not only README or comments.
  failure_patterns:
  - Missing scope is silently skipped.
  - No inventory of deployment units, migrations, CI, docs, tests.
  risk_if_failed: 'Review gaps: hidden production blockers remain unreported.'
  auto_checkability: partial
  adr_or_exception_policy: required_if_deviating_from_required_or_blocking_practice
  severity_downgrade_conditions:
  - Only downgrade when the code path is demonstrably not reachable, not deployed, or the application is truly single-tenant/non-production
    for that path.
  - Do not downgrade security, money, tenant isolation, destructive migration, backup/restore, or production secrets risks
    because the team is small.
  agent_review_instruction: Use the repository as the primary source of truth. Find concrete files, imports, SQL, migrations,
    tests, CI jobs, deployment config, and runtime config examples. Treat README/docs as supporting evidence only. Do not
    modify code. Report absence explicitly when the expected artifact is missing.
  tags: []
- id: GOV-001
  title: Service profile and C1 to C2 delta
  manifest_sections:
  - '4'
  - '35'
  - '36'
  - Appendix A
  - Appendix H
  category: governance
  scopes:
  - docs
  - infra_deploy
  - tests
  applies_to_service_classes:
  - C1
  - C2
  applies_to_stage:
  - pre_production
  - production_readiness
  normative_strength_from_manifest: must
  severity_if_failed_default: high
  problem_types:
  - production_readiness_gap
  - governance_gap
  requirement: 'The project must have enough service-profile information to assess current C1 readiness and the delta to C2
    B2B SaaS production readiness: owner, RTO/RPO, SLO, data class, tenancy, dependencies, backup, deploy and rollback.'
  evidence_to_collect:
  - docs/service-profile.md or equivalent
  - service catalog
  - deployment docs
  - README only as weak evidence
  how_to_check:
  - Look for explicit class C1/C2, RTO/RPO/SLO and data classification.
  - Separate C1 blockers from C2 blockers.
  - 'Flag missing C2 obligations: PITR, monthly restore drill, threat model, load/capacity test, audit/access review, low-downtime
    rollout.'
  pass_criteria:
  - Concrete code/config/test evidence confirms the requirement, not only README or comments.
  failure_patterns:
  - No service class or business criticality.
  - C2 claims without RTO/RPO/SLO or restore/load evidence.
  - Single VPS C2 has no time-bounded risk owner.
